name: DramaSO Server Up or DOWN check

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore previous status
        id: restore
        run: |
          if [ -f .status ]; then
            echo "Previous status:"
            cat .status
          else
            echo "unknown" > .status
          fi

      - name: Check website availability
        id: check
        run: |
          echo "RUN TRIGGERED: $(date -u)"

          MAIN_URL="https://dramaso.org"
          API_URL="https://api.dramaso.org"
          STATUS="down"
          COLOR="15158332"

          # Cache-bust for API only
          CACHE_BUST=$(date +%s)

          # ── Main site check ──────────────────────────────────────────────
          # No cache-bust query param — some sites 404 on unknown query strings
          # Cache-Control headers are sufficient to bypass Cloudflare caching
          MAIN_HTTP=$(curl -s \
            -L --max-redirs 5 \
            -o /tmp/main_body.txt \
            -D /tmp/main_headers.txt \
            -w "%{http_code}" \
            --max-time 10 \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            "$MAIN_URL" \
            || echo "000")

          MAIN_BODY=$(cat /tmp/main_body.txt)
          MAIN_CF_CACHE=$(grep -i "^cf-cache-status:" /tmp/main_headers.txt \
            | awk '{print tolower($2)}' | tr -d '\r\n')

          echo "Main HTTP: $MAIN_HTTP"
          echo "Main CF-Cache-Status: $MAIN_CF_CACHE"

          MAIN_CF_CACHED=false
          if echo "$MAIN_CF_CACHE" | grep -qiE "^(hit|stale|expired|revalidated)$"; then
            MAIN_CF_CACHED=true
            echo "WARNING: Cloudflare served a cached response for main site"
          fi

          MAIN_CF_ERROR=false
          if echo "$MAIN_BODY" | grep -qiE \
            "(error 52[1-4]|cloudflare.*origin|web server is down|connection timed out|origin is unreachable|this page has been cached by cloudflare)"; then
            MAIN_CF_ERROR=true
          fi

          MAIN_OK=false
          if [ "$MAIN_HTTP" -ge 200 ] && [ "$MAIN_HTTP" -lt 400 ] \
            && [ "$MAIN_CF_ERROR" = "false" ] \
            && [ "$MAIN_CF_CACHED" = "false" ]; then
            MAIN_OK=true
          fi

          # ── API check ────────────────────────────────────────────────────
          # 4xx from API still means origin is alive and responding
          API_HTTP=$(curl -s \
            -L --max-redirs 5 \
            -o /tmp/api_body.txt \
            -D /tmp/api_headers.txt \
            -w "%{http_code}" \
            --max-time 10 \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            "${API_URL}/?nocache=${CACHE_BUST}" \
            || echo "000")

          echo "API HTTP: $API_HTTP"

          API_OK=false
          if [ "$API_HTTP" -ge 200 ] && [ "$API_HTTP" -lt 500 ]; then
            API_OK=true
          fi

          # ── Verdict ──────────────────────────────────────────────────────
          if [ "$MAIN_OK" = "true" ] && [ "$API_OK" = "true" ]; then
            STATUS="up"
            MESSAGE="✅ DramaSO is UP — site HTTP $MAIN_HTTP, API HTTP $API_HTTP."
            COLOR="3066993"
          else
            STATUS="down"
            if [ "$MAIN_CF_CACHED" = "true" ]; then
              REASON="Cloudflare is serving a cached page (origin unreachable)"
            elif [ "$MAIN_CF_ERROR" = "true" ]; then
              REASON="Cloudflare error page detected (HTTP $MAIN_HTTP)"
            elif [ "$MAIN_HTTP" = "000" ]; then
              REASON="No response from server (connection failed)"
            else
              REASON="HTTP $MAIN_HTTP (site), HTTP $API_HTTP (API)"
            fi
            MESSAGE="🚨 DramaSO is DOWN ($REASON). Hang tight! In the meantime, ping Morgue in Tech Support on the DramaSO Discord and they'll look into it."
            COLOR="15158332"
          fi

          PREVIOUS_STATUS=$(cat .status)
          echo "Current: $STATUS"
          echo "Previous: $PREVIOUS_STATUS"
          echo "status=$STATUS"            >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS_STATUS" >> $GITHUB_OUTPUT
          echo "message=$MESSAGE"          >> $GITHUB_OUTPUT
          echo "color=$COLOR"              >> $GITHUB_OUTPUT

      - name: Send Discord notification only on change
        if: steps.check.outputs.status != steps.check.outputs.previous
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="${{ steps.check.outputs.message }}"
          COLOR="${{ steps.check.outputs.color }}"
          UNIX_TIME=$(date +%s)
          PAYLOAD=$(jq -n \
            --arg desc "$MESSAGE" \
            --argjson color "$COLOR" \
            --arg ts "$UNIX_TIME" \
            '{
              embeds: [{
                title: "DramaSO Server Status",
                description: $desc,
                color: $color,
                fields: [{
                  name: "Timestamp",
                  value: ("<t:" + $ts + ":F>\n<t:" + $ts + ":R>"),
                  inline: false
                }]
              }]
            }')
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"

      - name: Save current status
        run: |
          echo "${{ steps.check.outputs.status }}" > .status

      - name: Commit updated status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .status
          git diff --cached --quiet || git commit -m "Update website status"

      - name: Push changes
        run: |
          git pull --rebase origin HEAD
          git push
