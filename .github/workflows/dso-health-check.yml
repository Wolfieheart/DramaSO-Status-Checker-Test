name: DramaSO Uptime Monitor
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
concurrency:
  group: uptime-monitor
  cancel-in-progress: false
jobs:
  check-uptime:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      - name: Read previous status
        id: prev
        run: |
          PREV="UNKNOWN"
          if [ -f .status ]; then
            PREV=$(cat .status)
          fi
          echo "status=$PREV" >> "$GITHUB_OUTPUT"
      - name: Check API
        id: check
        run: >
          STATUS="DOWN"

          SOURCE="none"

          DETAIL="No endpoints reachable"


          check_url() {
            local url="$1"
            local label="$2"

            BODY=$(curl -s --max-time 15 --connect-timeout 10 -H "User-Agent: Mozilla/5.0" "$url")
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --connect-timeout 10 -H "User-Agent: Mozilla/5.0" "$url")

            echo "[$label] HTTP=$HTTP"

            if [[ ! "$HTTP" =~ ^2[0-9][0-9]$ && ! "$HTTP" =~ ^3[0-9][0-9]$ ]]; then
              DETAIL="HTTP $HTTP from $label"
              return 1
            fi

            echo "$BODY" | jq empty >/dev/null 2>&1
            if [ $? -ne 0 ]; then
              DETAIL="Invalid JSON from $label"
              return 1
            fi

            if [ -z "$BODY" ]; then
              DETAIL="Empty response from $label"
              return 1
            fi

            return 0
          }


          if check_url "https://backup.dramaso.org/userapi/city/1/city.json" "city-api"; then
            STATUS="UP"
            SOURCE="city-api"
          elif check_url "https://backup.dramaso.org/userapi/avatars/online" "avatars-api"; then
            STATUS="UP"
            SOURCE="avatars-api"
          fi


          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"

          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Detect change
        id: change
        run: |
          CURRENT="${{ steps.check.outputs.status }}"
          PREV="${{ steps.prev.outputs.status }}"

          if [ "$CURRENT" = "$PREV" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit (only on change)
        if: steps.change.outputs.changed == 'true'
        run: >
          echo "${{ steps.check.outputs.status }}" > .status


          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"


          git add .status

          git commit -m "status ${{ steps.check.outputs.status }} @ ${{ steps.check.outputs.timestamp }}"

          git push origin main
      - name: Discord notify (only on change)
        if: steps.change.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CURRENT="${{ steps.check.outputs.status }}"
          PREV="${{ steps.prev.outputs.status }}"
          SOURCE="${{ steps.check.outputs.source }}"
          DETAIL="${{ steps.check.outputs.detail }}"
          TS="${{ steps.check.outputs.timestamp }}"

          if [ "$CURRENT" = "UP" ]; then
            COLOR=3066993
            TITLE="🟢 DramaSO UP"
          else
            COLOR=15158332
            TITLE="🔴 DramaSO DOWN"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg change "$PREV → $CURRENT" \
            --arg source "$SOURCE" \
            --arg detail "$DETAIL" \
            --arg ts "$TS" \
            --argjson color "$COLOR" \
            '{
              username: "DramaSO Monitor",
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Change", value: $change, inline: false },
                  { name: "Source", value: $source, inline: false },
                  { name: "Detail", value: $detail, inline: false }
                ],
                footer: { text: ("Checked at " + $ts) }
              }]
            }')

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
