name: DramaSO Server Up or DOWN check

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore previous status
        id: restore
        run: |
          if [ -f .status ]; then
            echo "Previous status:"
            cat .status
          else
            echo "unknown" > .status
          fi

      - name: Check website availability
        id: check
        run: |
          echo "RUN TRIGGERED: $(date -u)"
          URL="https://dramaso.org"
          STATUS="down"
          MESSAGE=""
          COLOR="15158332"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            STATUS="up"
            MESSAGE="✅ DramaSO is UP — responded with HTTP $HTTP_STATUS."
            COLOR="3066993"
          else
            STATUS="down"
            MESSAGE="🚨 DramaSO is DOWN — responded with HTTP $HTTP_STATUS."
            COLOR="15158332"
          fi
          PREVIOUS_STATUS=$(cat .status)
          echo "Current: $STATUS"
          echo "Previous: $PREVIOUS_STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS_STATUS" >> $GITHUB_OUTPUT
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Send Discord notification only on change
        if: steps.check.outputs.status != steps.check.outputs.previous
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="${{ steps.check.outputs.message }}"
          COLOR="${{ steps.check.outputs.color }}"
          UNIX_TIME=$(date +%s)
          PAYLOAD=$(jq -n \
            --arg desc "$MESSAGE" \
            --argjson color "$COLOR" \
            --arg ts "$UNIX_TIME" \
            '{
              embeds: [{
                title: "DramaSO Server Status",
                description: $desc,
                color: $color,
                fields: [{
                  name: "Timestamp",
                  value: ("<t:" + $ts + ":F>\n<t:" + $ts + ":R>"),
                  inline: false
                }]
              }]
            }')
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"

      - name: Save current status
        run: |
          echo "${{ steps.check.outputs.status }}" > .status

      - name: Commit updated status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .status
          git diff --cached --quiet || git commit -m "Update website status"

      - name: Push changes
        run: |
          git pull --rebase origin HEAD
          git push
