name: DramaSO Uptime Monitor

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check-uptime:
    runs-on: self-hosted
    steps:
    - name: Checkout main
      uses: actions/checkout@v4

    - name: Install jq
      run: |
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y jq
        fi

    - name: Check DramaSO server status
      id: check
      run: |
        STATUS="DOWN"
        DETAIL="Could not reach up.php"

        CURL_EXIT=0
        BODY=$(curl -s \
          --max-time 15 \
          --connect-timeout 10 \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
          "https://www.dramaso.org/up.php" 2>/tmp/curl_err.txt) || CURL_EXIT=$?

        echo "curl exit: $CURL_EXIT"
        echo "Response body: $BODY"

        if [ "$CURL_EXIT" -ne 0 ]; then
          DETAIL="curl failed (exit $CURL_EXIT) — $(cat /tmp/curl_err.txt)"

        elif echo "$BODY" | grep -qi "City is DOWN"; then
          DETAIL="up.php reports: City is DOWN"

        elif echo "$BODY" | grep -qiE "(hour|minute|day|second|ago)"; then
          STATUS="UP"
          DETAIL="up.php reports uptime: $BODY"

        else
          DETAIL="up.php returned unexpected response: $BODY"
        fi

        echo "status=$STATUS"    >> "$GITHUB_OUTPUT"
        echo "detail=$DETAIL"    >> "$GITHUB_OUTPUT"
        echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Read previous status
      id: prev
      run: |
        PREV="UNKNOWN"
        if [ -f .status ]; then
          PREV=$(cat .status)
        fi
        echo "status=$PREV" >> "$GITHUB_OUTPUT"

    - name: Commit status to main
      run: |
        echo "${{ steps.check.outputs.status }}" > .status

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add .status

        git diff --cached --quiet || \
          git commit -m "chore: status ${{ steps.check.outputs.status }} @ ${{ steps.check.outputs.timestamp }}"

        git push origin main

    - name: Send Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        CURRENT="${{ steps.check.outputs.status }}"
        PREV="${{ steps.prev.outputs.status }}"
        DETAIL="${{ steps.check.outputs.detail }}"
        TIMESTAMP="${{ steps.check.outputs.timestamp }}"

        if [ "$CURRENT" = "$PREV" ]; then
          CHANGE_LINE="No change — still **${CURRENT}**"
        else
          CHANGE_LINE="⚠️ Status changed from **${PREV}** → **${CURRENT}**"
        fi

        if [ "$CURRENT" = "UP" ]; then
          COLOR=3066993
          TITLE="🟢 DramaSO is UP"
          FIELD_NAME="Uptime info"
        else
          COLOR=15158332
          TITLE="🔴 DramaSO is DOWN"
          FIELD_NAME="Reason"
        fi

        PAYLOAD=$(jq -n \
          --arg title "$TITLE" \
          --arg change "$CHANGE_LINE" \
          --arg fname "$FIELD_NAME" \
          --arg fvalue "$DETAIL" \
          --arg ts "$TIMESTAMP" \
          --argjson col "$COLOR" \
          '{
            username: "DramaSO Status Monitor by Wolfieheart",
            avatar_url: "https://www.dramaso.org/favicon.ico",
            embeds: [{
              title: $title,
              color: $col,
              fields: [
                { name: "Status",  value: $change, inline: false },
                { name: $fname,    value: $fvalue, inline: false }
              ],
              footer: {
                text: ("Checked at " + $ts)
              }
            }]
          }')

        HTTP=$(curl -s \
          -o /dev/null \
          -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "$DISCORD_WEBHOOK")

        echo "Discord webhook response: $HTTP"

        if [[ "$HTTP" != "204" ]]; then
          echo "::warning::Discord webhook returned HTTP $HTTP"
        fi
