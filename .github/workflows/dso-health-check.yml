name: DramaSO Uptime Monitor

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check-uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check DramaSO server status
        id: check
        run: |
          STATUS="DOWN"
          SOURCE="none"
          DETAIL="No endpoints could be reached"

          check_url() {
            local url="$1"
            local label="$2"

            HTTP_CODE=$(curl -s -o /tmp/response_body.txt -w "%{http_code}" \
              --max-time 15 \
              --connect-timeout 10 \
              -H "User-Agent: DramaSO-UptimeBot/1.0" \
              "$url" 2>/tmp/curl_err.txt)
            CURL_EXIT=$?

            echo "[$label] curl exit=$CURL_EXIT, HTTP=$HTTP_CODE"

            if [ $CURL_EXIT -ne 0 ]; then
              echo "[$label] Connection failed (curl exit $CURL_EXIT)"
              return 1
            fi

            # Cloudflare error pages (520-527, 530)
            if [[ "$HTTP_CODE" =~ ^(520|521|522|523|524|525|526|527|530)$ ]]; then
              echo "[$label] Cloudflare error detected (HTTP $HTTP_CODE)"
              DETAIL="Cloudflare error $HTTP_CODE on $label"
              return 1
            fi

            # 2xx and 3xx = UP
            if [[ "$HTTP_CODE" =~ ^[23] ]]; then
              echo "[$label] Reachable (HTTP $HTTP_CODE)"
              return 0
            fi

            echo "[$label] Server returned HTTP $HTTP_CODE — treating as DOWN"
            DETAIL="HTTP $HTTP_CODE from $label"
            return 1
          }

          # --- Primary: city API endpoint ---
          if check_url "https://backup.dramaso.org/userapi/city/1/city.json" "city-api"; then
            STATUS="UP"
            SOURCE="city-api (backup.dramaso.org)"
          # --- Fallback: up.php probe ---
          elif check_url "https://www.dramaso.org/up.php" "up-php"; then
            STATUS="UP"
            SOURCE="up-php (www.dramaso.org)"
          fi

          echo "status=$STATUS"       >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE"       >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL"       >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Read previous status
        id: prev
        run: |
          PREV="UNKNOWN"
          if [ -f .status ]; then
            PREV=$(cat .status)
          fi
          echo "status=$PREV" >> "$GITHUB_OUTPUT"

      - name: Commit status to main
        run: |
          echo "${{ steps.check.outputs.status }}" > .status
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .status
          git diff --cached --quiet || git commit -m "chore: status ${{ steps.check.outputs.status }} @ ${{ steps.check.outputs.timestamp }}"
          git push origin main

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CURRENT="${{ steps.check.outputs.status }}"
          PREV="${{ steps.prev.outputs.status }}"
          SOURCE="${{ steps.check.outputs.source }}"
          DETAIL="${{ steps.check.outputs.detail }}"
          TIMESTAMP="${{ steps.check.outputs.timestamp }}"

          if [ "$CURRENT" = "$PREV" ]; then
            CHANGE_LINE="No change — still **${CURRENT}**"
          else
            CHANGE_LINE="⚠️ Status changed from **${PREV}** → **${CURRENT}**"
          fi

          if [ "$CURRENT" = "UP" ]; then
            COLOR=3066993
            EMOJI="🟢"
            TITLE="${EMOJI} DramaSO is UP"
            FIELD_NAME="Reached via"
            FIELD_VALUE="$SOURCE"
          else
            COLOR=15158332
            EMOJI="🔴"
            TITLE="${EMOJI} DramaSO is DOWN"
            FIELD_NAME="Reason"
            FIELD_VALUE="$DETAIL"
          fi

          PAYLOAD=$(jq -n \
            --arg title   "$TITLE" \
            --arg change  "$CHANGE_LINE" \
            --arg fname   "$FIELD_NAME" \
            --arg fvalue  "$FIELD_VALUE" \
            --arg ts      "$TIMESTAMP" \
            --argjson col "$COLOR" \
            '{
              username: "DramaSO Monitor",
              avatar_url: "https://www.dramaso.org/favicon.ico",
              embeds: [{
                title: $title,
                color: $col,
                fields: [
                  { name: "Status",    value: $change,  inline: false },
                  { name: $fname,      value: $fvalue,  inline: false }
                ],
                footer: { text: ("Checked at " + $ts) }
              }]
            }')

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK")

          echo "Discord webhook response: $HTTP"
          if [[ "$HTTP" != "204" ]]; then
            echo "::warning::Discord webhook returned HTTP $HTTP — notification may not have delivered"
          fi
